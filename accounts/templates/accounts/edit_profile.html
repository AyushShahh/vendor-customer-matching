{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - MarketPlace</title>
    <link rel="stylesheet" href="{% static 'vendor/styles/index.css' %}">
</head>
<body>
    <div class="main-content" style="margin-left:0; width:100%;">
        <h1 style="max-width:500px;margin:0 auto;">Edit Profile</h1>
        <br>
        <div class="section" style="max-width:500px;margin:0 auto;">
            {% if error_message %}
                <div class="alert alert-danger" style="margin-bottom:20px;">{{ error_message }}</div>
            {% endif %}
            <form method="post" class="form">
                {% csrf_token %}
                <div class="form-group">
                    <label>First Name:</label>
                    <input type="text" name="first_name" value="{{ request.user.first_name }}" required>
                </div>
                <div class="form-group">
                    <label>Last Name:</label>
                    <input type="text" name="last_name" value="{{ request.user.last_name }}" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" name="email" value="{{ request.user.email }}" required>
                </div>
                <div class="form-group">
                    <label>Phone number:</label>
                    <input type="text" name="phone_number" value="{{ request.user.phone_number }}" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Area:</label>
                        <input type="text" name="area" value="{{ request.user.area }}" required>
                    </div>
                    <div class="form-group">
                        <label>City:</label>
                        <input type="text" name="city" value="{{ request.user.city }}" required>
                    </div>
                    <div class="form-group">
                        <label>State:</label>
                        <input type="text" name="state" value="{{ request.user.state }}" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Save Changes</button>
                    <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
